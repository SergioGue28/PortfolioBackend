version: '3.8'

services:
  portfolio-db:
    image: mongo
    container_name: portfolio-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    networks:
      - portfolio-network

volumes:
  mongo-data:

networks:
  portfolio-network:
