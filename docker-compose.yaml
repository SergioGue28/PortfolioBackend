version: '3.8'

services:
  portfolio-db:
    image: mongo
    container_name: portfolio-db
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    networks:
      - portfolio-network

  portfolio-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - portfolio-db
    env_file:
      - .env
    networks:
      - portfolio-network

networks:
  portfolio-network:
